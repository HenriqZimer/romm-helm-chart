apiVersion: v1
entries:
  romm:
  - annotations:
      artifacthub.io/changes: |
        - kind: added
          description: Add liveness, readiness and startup probes for the RomM container
        - kind: added
          description: Add NOTES.txt with access instructions and warnings for non-persistent storage or default credentials
        - kind: added
          description: Add configurable ServiceAccount (serviceAccount.create/name/annotations)
        - kind: added
          description: Add checksum/secret and checksum/configmap pod annotations so upgrades roll pods when secrets or config change
        - kind: changed
          description: Enable persistence by default for RomM config/library/resources/assets and MariaDB data (previously emptyDir, causing data loss on pod restart)
        - kind: changed
          description: Add a safe-by-default container securityContext (allowPrivilegeEscalation false, drop all capabilities)
        - kind: changed
          description: Rename default secret placeholder values to make it obvious they must be changed before production use
        - kind: fixed
          description: CI lint workflow no longer swallows chart-testing failures with continue-on-error
      artifacthub.io/changesHistory: |
        - version: 1.0.7
          changes:
            - kind: added
              description: Add support for external MariaDB/MySQL databases
            - kind: changed
              description: DB_HOST is now dynamically generated based on mariadb.enabled setting
            - kind: fixed
              description: Fix duplicate DB_PORT environment variable error
            - kind: changed
              description: Simplify external database configuration (only host needed in externalDatabase)
        - version: 1.0.5
          changes:
            - kind: changed
              description: Add complete maintainer information with personal website
            - kind: changed
              description: Add Helm repository and maintainer links to Artifact Hub
            - kind: fixed
              description: Update maintainer email to henrique.zimermann@outlook.com
        - version: 1.0.3
          changes:
            - kind: fixed
              description: Fixed release workflow to skip existing releases
            - kind: changed
              description: Add skip_existing flag to prevent duplicate release errors
        - version: 1.0.2
          changes:
            - kind: changed
              description: Translate CHANGELOG to English
            - kind: changed
              description: Update maintainer email to henriqzimer@outlook.com
            - kind: changed
              description: Update chart icon URL to current RomM logo
            - kind: fixed
              description: Fix all repository URLs to use correct case (HenriqZimer)
        - version: 1.0.1
          changes:
            - kind: fixed
              description: Fixed lint workflow (removed --validate flag that requires K8s cluster)
            - kind: fixed
              description: Fixed repository name in cr.yaml
            - kind: changed
              description: Lint workflow now runs on all pushes to main branch
            - kind: changed
              description: Added workflow_dispatch for manual release execution
        - version: 1.0.0
          changes:
            - kind: added
              description: Initial release of RomM Helm Chart
            - kind: added
              description: Support for RomM application version 4.5.0
            - kind: added
              description: Full deployment configuration with Deployment, Service, Ingress
      artifacthub.io/license: MIT
      artifacthub.io/links: |
        - name: Helm Repository
          url: https://henriqzimer.github.io/romm-helm-chart/
        - name: Chart Source
          url: https://github.com/HenriqZimer/romm-helm-chart
        - name: Maintainer Website
          url: https://henriqzimer.com.br
        - name: GitHub Profile
          url: https://github.com/HenriqZimer
        - name: RomM Application
          url: https://github.com/rommapp/romm
        - name: Documentation
          url: https://github.com/HenriqZimer/romm-helm-chart/blob/main/chart/README.md
